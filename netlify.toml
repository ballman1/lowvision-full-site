# Netlify configuration for Low Vision Navigator

[build]
  publish = "dist"
  command = "npm run build"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none';"

# Long-lived immutable cache for hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for robots.txt so crawlers pick up changes quickly
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Short cache for sitemap so crawlers pick up changes quickly
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# www → apex 301 redirect (belt-and-suspenders with _redirects)
[[redirects]]
  from = "https://www.lowvisionnavigator.org/*"
  to = "https://lowvisionnavigator.org/:splat"
  status = 301
  force = true

# SPA fallback — serve index.html for all unmatched paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
